name: CI/CD Frontend AWS

on:
  push:
    branches: ["deploy"]

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Inyectar IP del Backend en Nginx
        run: sed -i 's/APP_PRIVATE_IP/${{ secrets.APP_PRIVATE_IP }}/g' nginx.conf

      - name: Build imagen Frontend y push a ECR
        run: |
          docker build -t tienda-frontend .
          docker tag tienda-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      - name: Desplegar Frontend vía SSM en EC2 Web
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_WEB_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Desplegar Frontend desde ECR" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest",
              "docker stop frontend || true",
              "docker rm -f frontend || true",
              "docker run -d --name frontend -p 80:8080 --restart unless-stopped ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest"
            ]}'
