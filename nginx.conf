server {
    # Escuchamos en el 8080 interno (alineado con la seguridad Non-Root de tu Dockerfile)
    listen 8080;
    
    # Catch-all: Responde a cualquier dominio/IP que apunte a este servidor
    server_name _;

    # --- OPTIMIZACIÓN SENIOR: Compresión GZIP ---
    # Reduce el peso de los archivos de React al viajar por la red, acelerando la carga de tu web
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 1. El bloque vital para React (La Interfaz Web)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Evita el error 404 al recargar la página gracias al enrutamiento interno de React
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Inverso: Interceptar llamadas a Ventas
    location /api/v1/ventas {
        proxy_pass http://APP_PRIVATE_IP:8080/api/v1/ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy Inverso: Interceptar llamadas a Despachos
    location /api/v1/despachos {
        proxy_pass http://APP_PRIVATE_IP:8081/api/v1/despachos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}