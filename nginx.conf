# /front_despacho/nginx.conf

server {
    listen 8080;
    server_name localhost;

    # Servir la aplicación React 
    location /api/v1/ventas {
        proxy_pass http://APP_PRIVATE_IP:8080/api/v1/ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Inverso: Interceptar llamadas a Despachos y enviarlas al contenedor interno
    location /api/v1/despachos {
        proxy_pass http://APP_PRIVATE_IP:8081/api/v1/despachos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}